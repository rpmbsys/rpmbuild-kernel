services:
  rocky9kerneltest:
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - rpm9rocky:/home/centos/rpmbuild/RPMS
    build:
      context: .
      args:
        os: $RL9
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    tmpfs:
      - /run

volumes:
  rpm9rocky:
    name: rpm9rocky